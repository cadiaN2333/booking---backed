server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: booking-backend

  datasource:
    url: 'jdbc:mysql://127.0.0.1:3306/booking?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true'
    username: root
    # ↓↓↓ 改成你本机 MySQL 的密码。本机 3306 已有 MySQL 8.0.41 在跑，不需要 Docker。
    password: ${BOOKING_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # 阶段一不用 Redis，连不上也不影响启动（Lettuce 懒连接）。
      # 做阶段二前启动 Docker Desktop 执行 `docker compose up -d` 即可。

  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

booking:
  # 下单后锁定时长（分钟），超时由释放任务归还库存
  lock-minutes: 15
  # 时段默认生成天数
  generate-days: 14
  recommendation:
    # 语义推荐默认关闭；开启前需准备可用的公开场地向量文档。
    vector-enabled: ${BOOKING_RECOMMENDATION_VECTOR_ENABLED:false}
    # 聊天理由增强默认关闭；保持关闭即可安全使用规则推荐。
    chat-enabled: ${BOOKING_RECOMMENDATION_CHAT_ENABLED:false}
  vector:
    # 阶段三默认关闭；开启前先启动 pgvector 并配置 OPENAI_API_KEY
    enabled: ${BOOKING_VECTOR_ENABLED:false}
    datasource-url: ${BOOKING_VECTOR_DB_URL:jdbc:postgresql://127.0.0.1:5432/booking_vector}
    datasource-username: ${BOOKING_VECTOR_DB_USERNAME:postgres}
    datasource-password: ${BOOKING_VECTOR_DB_PASSWORD:postgres}
    embedding-api-key: ${OPENAI_API_KEY:}
    embedding-base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    embedding-path: ${OPENAI_EMBEDDING_PATH:/v1/embeddings}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: ${BOOKING_VECTOR_DIMENSIONS:1536}
    schema-name: public
    table-name: booking_vector_store
    max-document-batch-size: 100

logging:
  level:
    com.example.booking: debug
