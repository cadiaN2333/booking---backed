# ⚠️ 本地开发不需要执行这个文件。
#
# 本机现状（2026-09-10 实测）：
#   - MySQL 8.0.41 已装在 C:\Program Files\MySQL\MySQL Server 8.0，运行在 3306
#   - Redis 8.10.1 已作为 Docker 容器 "redis" 运行在 6379
#   两个中间件都齐了，所以 `docker compose up -d` 反而会和现有容器抢端口。
#
# 这个文件保留给「换机器」或「部署」的场景：MySQL 对外映射 3307，避开本机 3306。
#   docker compose --profile docker-mysql up -d
services:
  mysql:
    profiles: ['docker-mysql']
    image: mysql:8.0
    container_name: booking-mysql
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: booking
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql-data:
